<section class="wrap">
  <!-- Tarjeta izquierda con imagen y texto -->
  <article class="panel panel--story">
    <img ngSrc="assets/arteIALanding.png" width="560" height="360" alt="MuseAI showcase" class="panel__img" />
    <div class="panel__body">
      <h2>Explicación</h2>
      <p class="panel__lead">
        ¿Quiénes somos y qué hemos desarrollado?
      </p>
      <small>(Tarjeta con efecto / movimiento)</small>
    </div>
  </article>

  <!-- Logo grande centro/derecha -->
  <div class="hero-brand">
    <img ngSrc="assets/brand/museai-logo.png" width="260" height="260" alt="Muse AI" class="hero-brand__logo" />
  </div>

  <!-- Callouts / botones -->
  <div class="callouts">
    <div class="callout">
      <p>Al iniciar sesión puedes ingresar todos los datos del usuario a asistir.</p>
      <a routerLink="/login" class="btn btn-secondary">Iniciar Sesión</a>
    </div>

    <div class="callout">
      <p>¿Aún no tienes una cuenta asociada? Ve a registrarte</p>
      <a routerLink="/register" class="btn btn-primary">Registrarse</a>
    </div>
  </div>
</section>
