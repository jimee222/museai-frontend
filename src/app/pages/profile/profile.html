<section class="profile-page">

  <header class="profile-header text-center">
    <h2 class="profile-title">Mi Perfil</h2>
    <p class="profile-subtitle">Visualiza tu información personal, quizzes y recorridos de MuseAI</p>
  </header>

  <nav class="tabs">
    <span 
      class="tab" 
      [class.active]="activeTab() === 'info'" 
      (click)="activeTab.set('info')"
    >
      Información Personal
    </span>

    <span 
      class="tab" 
      [class.active]="activeTab() === 'quizzes'" 
      (click)="activeTab.set('quizzes')"
    >
      Quizzes
    </span>
  </nav>

  <div class="profile-content-wrapper">

    <aside class="side-art left-art" *ngIf="activeTab() === 'info'">
      <lottie-player
        src="/assets/lottie/sculpting.json"
        background="transparent"
        speed="1"
        loop
        autoplay
      ></lottie-player>
    </aside>

    <div class="profile-content text-center">
      
      
      <ng-container *ngIf="!loading(); else loadingTpl">

        
        <ng-container *ngIf="user(); else errorTpl">

          <div class="tab-content" [ngClass]="{ active: activeTab() === 'info' }">
            <div class="card-container">
              <profile-card [user]="user()"></profile-card>
            </div>
          </div>

          
       <div class="tab-content" [ngClass]="{ active: activeTab() === 'quizzes' }">
  <div class="quiz-user-page-wrapper center">
    <app-my-quizzes></app-my-quizzes>
  </div>
</div>


        </ng-container>
      </ng-container>

     
      <ng-template #loadingTpl>
        <p class="text-light">Cargando perfil...</p>
      </ng-template>

      <ng-template #errorTpl>
        <p class="text-danger">{{ error() }}</p>
      </ng-template>

    </div>

    <aside class="side-art right-art" *ngIf="activeTab() === 'info'">
      <lottie-player
        src="/assets/lottie/drops.json"
        background="transparent"
        speed="1"
        loop
        autoplay
      ></lottie-player>
    </aside>

  </div>

</section>
