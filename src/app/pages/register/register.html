<section class="register-wrap">
  <aside class="register-media">
    <div class="panel__img-wrap">
      <img
        ngSrc="assets/arteiaVertical.webp"
        width="1" height="1"
      alt="Arte e IA"
      class="panel__img"
      />
    </div>
  </aside>
  <form class="register-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="reg-header">
      <img
        ngSrc="assets/brand/museai-logo.png"
        width="497" height="497"
      alt="Muse AI"
      class="reg-logo"
      />
      <h2>Registrar Usuario</h2>
    </header>

    <div class="grid">
      <label>
        <span>Nombre</span>
        <input type="text" formControlName="firstName" placeholder="Nombre"/>
        <small class="error" *ngIf="field('firstName').touched && field('firstName').invalid">
          Requerido (máx. 60)
        </small>
      </label>

      <label>
        <span>Primer Apellido</span>
        <input type="text" formControlName="lastName1" placeholder="Primer Apellido"/>
        <small class="error" *ngIf="field('lastName1').touched && field('lastName1').invalid">
          Requerido (máx. 60)
        </small>
      </label>

      <label>
        <span>Segundo Apellido</span>
        <input type="text" formControlName="lastName2" placeholder="Segundo Apellido"/>
      </label>

      <label>
        <span>Fecha de Nacimiento</span>
        <input type="date" formControlName="birthDate" />
        <small class="error" *ngIf="field('birthDate').touched && field('birthDate').errors?.['required']">
          Requerida
        </small>
        <small class="error" *ngIf="field('birthDate').errors?.['tooYoung']">
          Debes tener al menos 12 años para registrarte
        </small>
      </label>

      <label>
        <span>Correo</span>
        <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
        <small class="error" *ngIf="field('email').touched && field('email').invalid">
          Correo válido requerido
        </small>
      </label>

      <label>
        <span>Teléfono</span>
        <input type="tel" formControlName="phone" placeholder="+506 8888 8888"/>
        <small class="error" *ngIf="field('phone').touched && field('phone').invalid">
          Solo números, +, -, espacios (7–20)
        </small>
      </label>

      <div class="pwcol" [formGroup]="passwords">
        <label class="pwfield">
          <span>Contraseña</span>
          <div class="pw-input">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password"
            />
            <button type="button" (click)="toggleShow('password')" class="eye-btn">
              👁
            </button>
          </div>
          <small class="error" *ngIf="passwords.get('password')?.touched && passwords.get('password')?.invalid">
            Debe tener mínimo 8 caracteres, 2 mayúsculas, minúsculas y números
          </small>
        </label>

        <label class="pwfield">
          <span>Confirmar contraseña</span>
          <div class="pw-input">
            <input
              [type]="showConfirm() ? 'text' : 'password'"
              formControlName="confirm"
              placeholder="Repite la contraseña"
            />
            <button type="button" (click)="toggleShow('confirm')" class="eye-btn">
              👁
            </button>
          </div>
          <small class="error" *ngIf="passwords.errors?.['mismatch']">
            Las contraseñas no coinciden
          </small>
        </label>
      </div>

      <label class="level">
        <span>Nivel de conocimiento en arte</span>
        <select formControlName="artLevel">
          <option value="" disabled>Selecciona…</option>
          <option *ngFor="let lv of levels" [value]="lv.value">{{ lv.label }}</option>
        </select>
        <small class="error" *ngIf="field('artLevel').touched && field('artLevel').invalid">
          Selecciona un nivel
        </small>
      </label>
    </div>
    <button class="btn btn-primary submit"
        type="submit"
        [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Registrando…' : 'Registrar' }}
    </button>
    
   <!-- Botón oficial de Google (igual al de Login) -->
      <div id="googleRegisterBtn"
          style="margin-top: 10px; display: flex; justify-content: center;">
      </div>
  </form>
</section>
