<section class="login-wrap">
  <aside class="login-media">
    <div class="panel__img-wrap">
      <img
        ngSrc="assets/arteiaVertical.webp"
        width="768" height="768"
        priority
        alt="Arte e IA"
        class="panel__img"
      />
    </div>
  </aside>

  <form
    class="login-card"
    #loginNgForm="ngForm"
    (ngSubmit)="handleLogin($event)"
    novalidate
  >
    <header class="log-header">
      <img ngSrc="assets/brand/museai-logo.png" width="497" height="497" alt="Muse AI" class="log-logo" />
      <div class="titles">
        <h3>Iniciar Sesión</h3>
      </div>
      <div class="oauth-sep"></div>
    </header>

    <label>
      <span>Usuario</span>
      <input
        type="email"
        name="email"
        required
        email
        placeholder="correo@ejemplo.com"
        autocomplete="username"
        [(ngModel)]="loginForm.email"
        #email="ngModel"
      />
      <small class="error" *ngIf="email.touched && email.invalid">
        Ingrese un correo válido.
      </small>
    </label>

    <label>
      <span>Contraseña</span>
      <input
        type="password"
        name="password"
        required
        minlength="8"
        placeholder="••••••••"
        autocomplete="current-password"
        [(ngModel)]="loginForm.password"
        #password="ngModel"
      />
      <small class="error" *ngIf="password.touched && password.invalid">
        Contraseña requerida (mínimo 8 caracteres).
      </small>
    </label>

    <div class="row">
      <label class="remember">
        <input
          type="checkbox"
          name="remember"
          [(ngModel)]="loginForm.remember"
        />
        <span>Recordarme</span>
      </label>
      <a routerLink="/recover" class="link">¿Olvidó su contraseña?</a>
    </div>

    <p class="error" *ngIf="loginError">
      {{ loginError }}
    </p>

    <button class="btn btn-primary submit" type="submit">
      {{ isSubmitting ? 'Ingresando…' : 'Iniciar Sesión' }}
    </button>

    <p class="hint">
      ¿No tiene cuenta? <a routerLink="/register" class="link">Regístrese</a>
    </p>

    <!-- 🔹 Botón oficial de Google renderizado por el SDK -->
    <div id="googleButtonDiv" style="margin-top: 10px; display: flex; justify-content: center;"></div>
  </form>
</section>
