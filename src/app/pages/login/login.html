<section class="login-wrap">
  <aside class="login-media">
    <div class="panel__img-wrap">
      <img
        ngSrc="assets\arteiaVertical.webp"
        width="768" height="768"
        priority
        alt="Arte e IA"
        class="panel__img"
      />
    </div>
  </aside>

  <form
    class="login-card"
    #loginNgForm="ngForm"
    (ngSubmit)="handleLogin($event)"
    novalidate
  >
    <header class="log-header">
      <img ngSrc="assets/brand/museai-logo.png" width="497" height="497" alt="Muse AI" class="log-logo" />
      <div class="titles">
        <h3>Iniciar Sesión</h3>
      </div>
      <div class="oauth-sep">
      </div>

    </header>

    <label>
      <span>Usuario</span>
      <input
        type="email"
        name="email"
        required
        email
        placeholder="correo@ejemplo.com"
        autocomplete="username"
        [(ngModel)]="loginForm.email"
        #email="ngModel"
      />
      <small class="error" *ngIf="email.touched && email.invalid">
        Ingrese un correo válido.
      </small>
    </label>

    <label>
      <span>Contraseña</span>
      <input
        type="password"
        name="password"
        required
        minlength="8"
        placeholder="••••••••"
        autocomplete="current-password"
        [(ngModel)]="loginForm.password"
        #password="ngModel"
      />
      <small class="error" *ngIf="password.touched && password.invalid">
        Contraseña requerida (mínimo 8 caracteres).
      </small>
    </label>

    <div class="row">
      <label class="remember">
        <input
          type="checkbox"
          name="remember"
          [(ngModel)]="loginForm.remember"
        />
        <span>Recordarme</span>
      </label>
      <button type="button" class="link link-button" (click)="goToRecover()">¿Olvidó su contraseña?</button>
    </div>

    <p class="error" *ngIf="loginError">
      {{ loginError }}
    </p>

    <button class="btn btn-primary submit" type="submit">
      {{ isSubmitting ? 'Ingresando…' : 'Iniciar Sesión' }}
    </button>

    <p class="hint">
      ¿No tiene cuenta? <a routerLink="/register" class="link">Regístrese</a>
    </p>
    <button type="button" class="btn btn-google" (click)="googleSignIn()">
      <svg viewBox="0 0 48 48" aria-hidden="true" class="g-logo">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.7 1.2 9.2 3.6l-3.7 3.7c-1.5-1.4-3.5-2.1-5.5-2.1-4.7 0-8.6 3.8-8.6 8.6s3.8 8.6 8.6 8.6c4 0 6.9-2.3 7.9-5.5H24v-4.7h15.6c.2 1 .3 2 .3 3.2 0 8.8-5.9 15-15.9 15-9.2 0-16.6-7.5-16.6-16.6S14.8 9.5 24 9.5z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>
  </form>
</section>
