<section class="login-wrap">
  <!-- panel izquierda imagen -->
  <aside class="login-media">
    <div class="panel__img-wrap">
      <img
        ngSrc="assets/arteiaVertical.webp"
        width="768" height="768"
        priority
        alt="Arte e IA"
        class="panel__img"
      />
    </div>
  </aside>

  <!-- tarjeta de login -->
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <header class="log-header">
      <img ngSrc="assets/brand/museai-logo.png" width="497" height="497" alt="Muse AI" class="log-logo" />
      <div class="titles">
        <h3>Iniciar Sesión</h3>
      </div>
      <div class="oauth-sep">
      </div>

    </header>

    <label>
      <span>Usuario</span>
      <input type="email" formControlName="email" placeholder="correo@ejemplo.com" />
    </label>

    <label>
      <span>Contraseña</span>
      <input type="password" formControlName="password" placeholder="••••••••" />
    </label>

    <div class="row">

      <a routerLink="/recover" class="link">¿Olvidó su contraseña?</a>
    </div>

    <button class="btn btn-primary submit" type="submit" [disabled]="!canSubmit()">
      {{ submitting() ? 'Ingresando…' : 'Iniciar Sesión' }}
    </button>

    <p class="hint">
      ¿No tiene cuenta? <a routerLink="/register" class="link">Regístrese</a>
    </p>
    <button type="button" class="btn btn-google" (click)="googleSignIn()">
      <svg viewBox="0 0 48 48" aria-hidden="true" class="g-logo">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.7 1.2 9.2 3.6l-3.7 3.7c-1.5-1.4-3.5-2.1-5.5-2.1-4.7 0-8.6 3.8-8.6 8.6s3.8 8.6 8.6 8.6c4 0 6.9-2.3 7.9-5.5H24v-4.7h15.6c.2 1 .3 2 .3 3.2 0 8.8-5.9 15-15.9 15-9.2 0-16.6-7.5-16.6-16.6S14.8 9.5 24 9.5z"/>
      </svg>
      <span>Continuar con Google</span>
    </button>
  </form>
</section>
