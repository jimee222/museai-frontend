<div class="profile-card" *ngIf="user">
  <div class="header text-center">
    <h3 class="name">{{ user.firstName }} {{ user.lastName1 }} {{ user.lastName2 }}</h3>
    <p class="email">{{ user.email }}</p>
  </div>

  <div class="info-grid">
    <div class="info-item">
      <span class="info-label">Fecha de Nacimiento:</span>
      <span class="info-value">{{ user.birthDate | date:'longDate' }}</span>
    </div>

    <div class="info-item">
      <span class="info-label">Teléfono:</span>
      <span class="info-value">{{ user.phone || 'No especificado' }}</span>
    </div>

    <div class="info-item">
      <span class="info-label">Nivel de conocimiento en arte:</span>
      <span class="info-value">{{ getArtLevelLabel(user.artLevel) }}</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary submit" (click)="goToEditProfile()">
      Editar Perfil
    </button>
  </div>
</div>

<div *ngIf="!user" class="no-user">
  <p>No se encontró información del usuario.</p>
</div>
