<!-- src/app/components/landing/navbar/navbar.component.html -->
<header class="nav-wrapper">
  <mat-toolbar class="nav" color="transparent">
    <div class="nav__inner">
      <!-- Logo Code Horizon -->
      <button class="nav__brand" type="button" (click)="scrollTo('hero')">
        <img
          ngSrc="assets/brand/CodeHorizon.png"
          alt="Code Horizon"
          width="220"
          height="56"
          class="brand-logo"
        />
      </button>

      <!-- Links desktop -->
      <nav class="nav__links nav__links--desktop">
        <button mat-button class="nav-link" (click)="scrollTo('hero')">Inicio</button>
        <button mat-button class="nav-link" (click)="scrollTo('team')">Nuestro equipo</button>
        <button mat-button class="nav-link" (click)="scrollTo('story')">Nuestra historia</button>
        <button mat-button class="nav-link" (click)="scrollTo('vision')">Visión &amp; Misión</button>
        <button mat-button class="nav-link" (click)="scrollTo('services')">Servicios</button>
        <button mat-button class="nav-link" (click)="scrollTo('cases')">Casos de éxito</button>
      </nav>

      <!-- CTA desktop -->
      <div class="nav__cta nav__links--desktop">
        <button mat-flat-button color="primary" class="nav-cta" (click)="scrollTo('contact')">
          Agenda una reunión
        </button>
      </div>

      <!-- Menú mobile (simple: lleva al inicio) -->
      <button
        mat-icon-button
        class="nav__menu-btn"
        [attr.aria-label]="'Ir al inicio'"
        (click)="scrollTo('hero')"
      >
        <mat-icon>menu</mat-icon>
      </button>
    </div>
  </mat-toolbar>
</header>
