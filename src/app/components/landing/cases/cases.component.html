<!-- src/app/components/landing/cases/cases.component.html -->
<section id="cases" class="section section--tight cases">
  <div class="section__inner">
    <header class="section__header">
      <p class="section__eyebrow">Casos de éxito</p>
      <h2 class="section__title">Proyectos que nos representan</h2>
    </header>

    <div class="cases__grid">
      <mat-card class="case-card glass" *ngFor="let item of cases" (click)="goTo(item.name)">
        <div class="case-card__image-wrap">
          <img
            ngSrc="{{ item.image }}"
            [alt]="item.name"
            width="400"
            height="225"
          />
        </div>
        <mat-card-content>
          <h3 class="case-card__title">{{ item.name }}</h3>
          <p class="case-card__description">
            {{ item.description }}
          </p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</section>
