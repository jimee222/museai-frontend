<section id="hero" class="section hero">
  <div class="section__inner hero__grid">
    <div class="hero__content">
      <p class="section__eyebrow">Code Horizon · Agencia de desarrollo</p>
      <h1 class="hero__title">Transformamos visión en experiencia.</h1>
      <p class="hero__subtitle">
        Somos Code Horizon, el equipo detrás de MuseAI y otras soluciones que combinan
        desarrollo de software, UX y tecnologías emergentes.
      </p>
      <div class="hero__actions">
        <button
          mat-flat-button
          color="primary"
          class="hero__primary-cta"
          (click)="scrollTo('services')"
        >
          Ver servicios
        </button>
        <button mat-stroked-button class="hero__secondary-cta" (click)="scrollTo('cases')">
          Casos de éxito
        </button>
      </div>
    </div>

    <!-- Logo Code Horizon -->
    <div class="hero__visual">
  <div class="code-horizon-logo">
    <div class="logo-mark">
      <!-- < -->
      <div class="bracket bracket-left">&lt;</div>

      <!-- Sol + Agua -->
      <div class="sun-block">
        <div class="sun-wrapper">
          <div class="sun"></div>
        </div>

        <!-- Agua -->
        <div class="water">
          <span class="wave wave-1"></span>
          <span class="wave wave-2"></span>
          <span class="wave wave-3"></span>
        </div>
      </div>

      <!-- > -->
      <div class="bracket bracket-right">&gt;</div>
    </div>

    <!-- Texto -->
    <div class="logo-text">
      <span class="code">Code</span>
      <span class="horizon">HORIZON</span>
    </div>
  </div>
</div>

  </div>
</section>
