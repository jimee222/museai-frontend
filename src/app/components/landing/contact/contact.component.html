<section id="contact" class="section section--tight contact">
  <div class="section__inner">
    <div class="contact-card">
      <!-- Lado izquierdo: texto -->
      <div class="contact-card__content">
        <h2 class="contact-card__title">¿Hablamos?</h2>
        <p class="contact-card__text">
          Si quieres una solución parecida a <strong>MuseAI</strong> o
          <strong>NutriAgenda</strong>, podemos ayudarte a aterrizar tu idea,
          definir el alcance y construir un roadmap técnico claro.
        </p>

        <div class="contact-card__actions">
          <button mat-flat-button class="contact-btn contact-btn--primary">
            Enviar brief
          </button>
          <button mat-stroked-button class="contact-btn contact-btn--secondary">
            Agendar llamada
          </button>
        </div>
      </div>

      <!-- Lado derecho: mini animación Code Horizon -->
      <div class="contact-card__visual">
        <div class="code-horizon-logo">
          <div class="logo-mark">
            <!-- < -->
            <div class="bracket bracket-left">&lt;</div>

            <!-- Sol + agua -->
            <div class="sun-block">
              <div class="sun-wrapper">
                <div class="sun"></div>
              </div>

              <div class="water">
                <span class="wave wave-1"></span>
                <span class="wave wave-2"></span>
                <span class="wave wave-3"></span>
              </div>
            </div>

            <!-- > -->
            <div class="bracket bracket-right">&gt;</div>
          </div>

          <div class="logo-text">
            <span class="code">Code</span>
            <span class="horizon">HORIZON</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
