<!-- src/app/components/landing/services/services.component.html -->
<section id="services" class="section services">
  <div class="section__inner">
    <header class="section__header">
      <p class="section__eyebrow">Servicios</p>
      <h2 class="section__title">Lo que podemos construir juntos</h2>
      <p class="section__description">
        Te acompañamos desde la idea hasta el despliegue, cuidando el diseño y la arquitectura
        técnica de cada módulo.
      </p>
    </header>

    <div class="services__grid">
      <mat-card class="service-card" *ngFor="let service of services">
        <mat-card-content>
          <div class="service-card__icon-wrapper">
            <mat-icon class="service-card__icon">{{ service.icon }}</mat-icon>
          </div>
          <h3 class="service-card__title">{{ service.title }}</h3>
          <p class="service-card__description">
            {{ service.description }}
          </p>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</section>
