<nav
  *ngIf="!hideHeader"
  class="nav"
  [class.nav--scrolled]="scrolled"
>
  <a class="brand" routerLink="/" aria-label="Ir al inicio">
    <img
      ngSrc="/assets/brand/museai-logo-solo.png"
      width="40"
      height="40"
      alt="Muse AI"
      class="brand__logo"
    />
    <span class="brand__name">MuseAI</span>
  </a>

  <div class="links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </a>

    <ng-container *ngIf="!isAuthenticated">
      <a routerLink="/login" routerLinkActive="active">Iniciar sesión</a>
      <a routerLink="/register" routerLinkActive="active">Crear cuenta</a>
    </ng-container>

    <ng-container *ngIf="isAuthenticated">
      <a routerLink="/museum" routerLinkActive="active">Explora 3D</a>
      <a routerLink="/create-canvas" routerLinkActive="active">Lienzo</a>
      <a routerLink="/app/profile" routerLinkActive="active">Perfil</a>
    </ng-container>

    <app-language-selector></app-language-selector>

    <button type="button" class="logout-btn" *ngIf="isAuthenticated" (click)="logout()">
      Cerrar sesión
    </button>
  </div>
</nav>
